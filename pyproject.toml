[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cmip7-cmor-common"
version = "0.3.0"
description = "Shared CMOR-free code for CMIP7 cmorization: bundles, coordinate reference, registry lookup, CV state, reduced Gaussian grids, LPJG output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "netCDF4",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cmip7_cmor_common*"]
